# Builds the Mac app on an Apple silicon Mac in GitHub's cloud.
#
# - Pushing a version tag (e.g. v1.1.0) publishes a Release with the .dmg attached.
# - "Run workflow" on the Actions tab builds a .dmg you can download from that run.

name: Build Mac app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build:mac

      - uses: actions/upload-artifact@v4
        with:
          name: Signal9-Print-Studio-mac
          path: dist/*.dmg

      # The tag's message becomes the release notes; its first paragraph is what
      # the app's update card shows. Tag with: git tag -a v1.2.0 -m "What's new…"
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          NOTES=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")
          printf '%s\n\n---\nFirst time installing? Download the .dmg below, open it and drag Signal9 Print Studio into Applications, then see the README for the one-time approval step. Already installed? The app offers this update itself.\n' "$NOTES" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.dmg \
            --title "Signal9 Print Studio $GITHUB_REF_NAME" \
            --notes-file notes.md \
          || gh release upload "$GITHUB_REF_NAME" dist/*.dmg --clobber
