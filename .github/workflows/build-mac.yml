# Builds the Mac app on an Apple silicon Mac in GitHub's cloud.
#
# - Pushing a version tag (e.g. v1.1.0) publishes a Release with the .dmg attached.
# - "Run workflow" on the Actions tab builds a .dmg you can download from that run.

name: Build Mac app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build:mac

      - uses: actions/upload-artifact@v4
        with:
          name: Signal9-Print-Studio-mac
          path: dist/*.dmg

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.dmg \
            --title "Signal9 Print Studio $GITHUB_REF_NAME" \
            --notes "Download the .dmg below, open it and drag Signal9 Print Studio into Applications. First launch: see the README's install steps." \
          || gh release upload "$GITHUB_REF_NAME" dist/*.dmg --clobber
